name: Update profile art

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build contribution heatmap
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          python scripts/make_contribution_svg.py             --username LokeshPusdekar             --token "$PROFILE_TOKEN"             --out contribution-heatmap.svg

      - name: Commit updated art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contribution-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution art"
          git push
